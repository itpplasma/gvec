# Lean GitHub Actions CI for the itpplasma/gvec fork.
# Mirrors the essentials of the upstream GitLab CI (.gitlab-ci.yml, CI_templates/):
# ubuntu-24 package set (CI_images/ubuntu-24), CMake presets, ctest, pytest -m unit.
name: CI

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHON_VERSION: "3.12" # Ubuntu 24.04 system python, as in CI_images/ubuntu-24
  # fbtools revision used for free-boundary GVEC (BIEST submodule is fetched by pip)
  FBTOOLS_REV: 14a5c4a7c3ff7458780edf7ebb0bd76712b44fbf

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
  fortran:
    name: fortran (${{ matrix.preset }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","itp-build"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - gvec_config_release # Release + OpenMP
          - gvec_config_debug # Debug + OpenMP
          - gvec_config_no-omp_release
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          SCI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          SCI_MATRIX_PRESET: ${{ matrix.preset }}
        run: |-
          ci/run.sh ci-fortran
      - name: Install system packages
        run: |
          sudo apt-get update
          # packages from CI_images/ubuntu-24 (gcc/gfortran 13) plus ninja/ccache
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache pkg-config gfortran g++ git liblapack-dev libblas-dev zlib1g-dev libnetcdf-dev libnetcdff-dev
        if: ${{ github.event.pull_request.head.repo.fork }}
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Python test dependencies (used by the registered ctest tests)
        run: |
          python -m pip install pytest numpy pyyaml f90nml netcdf4 xarray scipy \
            matplotlib tabulate tomlkit tqdm pyevtk requests f90wrap
        if: ${{ github.event.pull_request.head.repo.fork }}
      - uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: fortran-${{ matrix.preset }}
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }} -B build -G Ninja
          -DPython_EXECUTABLE="$(which python)"
          -DCMAKE_Fortran_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build
        run: cmake --build build --parallel
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Test (registered ctest tests)
        # the tests share ctest_run/ctest_post directories, so run them serially
        run: ctest --test-dir build --output-on-failure --no-tests=error

        if: ${{ github.event.pull_request.head.repo.fork }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
  python:
    name: python (${{ matrix.build_type }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","itp-build"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    env:
      # job-wide like upstream's exported variable: test_build_type compares it with the built library
      SKBUILD_CMAKE_BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # setuptools_scm needs tags
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          SCI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          SCI_MATRIX_BUILD_TYPE: ${{ matrix.build_type }}
        run: |-
          ci/run.sh ci-python
      - name: Install system packages
        run: |
          sudo apt-get update
          # packages from CI_images/ubuntu-24 (gcc/gfortran 13) plus ninja/ccache
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache pkg-config gfortran g++ git liblapack-dev libblas-dev zlib1g-dev libnetcdf-dev libnetcdff-dev
        if: ${{ github.event.pull_request.head.repo.fork }}
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
        if: ${{ github.event.pull_request.head.repo.fork }}
      - uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: python-${{ matrix.build_type }}
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build wheel (scikit-build-core, as upstream .script_build_py)
        env:
          SKBUILD_CMAKE_DEFINE: USE_OPENMP=On;USE_MPI=Off
          CMAKE_Fortran_COMPILER_LAUNCHER: ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
        run: |
          python -m pip install build
          python -m build --wheel
          ls dist/
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl pytest
          pygvec --version
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Unit tests (upstream .script_unit)
        run: python -m pytest -m unit -v -rA --require-pygvec --junitxml=pytest.xml

        if: ${{ github.event.pull_request.head.repo.fork }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
  free-boundary:
    name: ${{ github.event_name == 'workflow_dispatch' && format('free-boundary ({0})', matrix.repetition) || 'free-boundary' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Separate hosted runners exercise hardware/build roundoff as well as test order.
        repetition: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[1,2,3]' || '[1]') }}
    env:
      # Small interior systems run faster serially; the FD pool uses all four CPUs.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Install system packages
        run: |
          sudo apt-get update
          # packages from CI_images/ubuntu-24 (gcc/gfortran 13) plus ninja/ccache
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache pkg-config gfortran g++ git liblapack-dev libblas-dev zlib1g-dev libnetcdf-dev libnetcdff-dev libfftw3-dev
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: free-boundary
      - name: Install fbtools and GVEC (no build isolation)
        env:
          CMAKE_Fortran_COMPILER_LAUNCHER: ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          python -m pip install scikit-build-core setuptools_scm numpy f90wrap \
            pytest cmake ninja pybind11
          # pip fetches the BIEST/SCTL submodules of fbtools recursively
          python -m pip install --no-build-isolation \
            "fbtools @ git+https://gitlab.mpcdf.mpg.de/nmpp-mhd-group/fhindenlang/fbtools.git@${FBTOOLS_REV}"
          # use the free_boundary extra once the branch defines it
          if grep -q '^free_boundary *=' pyproject.toml; then spec='.[free_boundary]'; else spec='.'; fi
          python -m pip install --no-build-isolation "$spec"
      - name: Import check
        run: |
          lscpu
          python -c "import fbtools, gvec, numpy; print('fbtools', fbtools.__file__); print('gvec', gvec.__version__); numpy.show_runtime()"
      - name: Free-boundary tests
        run: |
          set -euo pipefail
          # free-boundary tests are recognised by marker or by file name
          marked=$(grep -rlE 'mark\.(free_boundary|freeboundary)' test-CI || true)
          files=$(find test-CI -type f -name 'test_*.py' -ipath '*free*boundary*' | sort)
          if [ -n "$marked" ]; then
            echo "Marked free-boundary tests in:"; echo "$marked"
            # no `|| true`: failures and "no tests collected" (exit 5) fail the job
            python -m pytest -v -rA --tb=short --require-pygvec \
              --durations=10 --junitxml=free-boundary.xml -o junit_family=legacy \
              -m "(free_boundary or freeboundary) and not slow" test-CI
          elif [ -n "$files" ]; then
            echo "Free-boundary test files:"; echo "$files"
            mapfile -t files_arr <<< "$files"
            python -m pytest -v -rA --tb=short --require-pygvec \
              --durations=10 --junitxml=free-boundary.xml -o junit_family=legacy \
              -m "not slow" "${files_arr[@]}"
          else
            echo "::notice::No free-boundary tests on this branch; only the import check ran."
          fi
      - name: Upload free-boundary results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: free-boundary-${{ matrix.repetition }}
          path: free-boundary.xml
          if-no-files-found: error
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
